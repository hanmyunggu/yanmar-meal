<title>YANMAR · 식수관리</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f4f6f8;color:#202124;font-family:Arial,"Noto Sans KR",sans-serif}
body{min-height:100dvh}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:16px}
.main-card{background:#fff;border:1px solid #e1e4e8;border-radius:26px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.07)}
.header{text-align:center;padding:2px 0 17px}
.logo{width:245px;max-width:70%;height:auto;display:block;margin:0 auto 10px}
.title{font-size:22px;font-weight:800}
.jp-title{font-size:15px;margin-top:4px;color:#555}
#reader{width:100%;background:#111;border-radius:20px;overflow:hidden;min-height:420px}
#reader video{width:100%!important;height:auto!important;display:block!important;object-fit:cover!important}
#reader__scan_region{width:100%!important}
#reader__dashboard_section,#reader__dashboard_section_csr,#reader__status_span{display:none!important}
.err{display:none;text-align:center;padding:18px;color:#666;line-height:1.6}
.retry{display:none;width:100%;padding:13px;border:0;border-radius:12px;background:#222;color:#fff;font-weight:700;font-size:15px}
.remaining{margin:0 0 12px;padding:12px 14px;border:1px solid #e2e5e9;border-radius:14px;background:#f7f8fa;text-align:center;font-size:19px;font-weight:800}.remaining span{font-size:24px}.hint{text-align:center;color:#555;font-size:14px;margin:13px 0 2px}
.status{text-align:center;font-size:12px;color:#777;margin-top:8px;min-height:18px}
.result{display:none;margin-top:14px;padding:22px 12px;border-radius:18px;text-align:center}
.result.success{display:block;background:#eaf8ef;border:1px solid #30a75a}
.result.duplicate{display:block;background:#fff1f1;border:1px solid #e55353}
.result.invalid{display:block;background:#fff8e8;border:1px solid #e2a900}
.icon{font-size:48px;font-weight:900}
.name{font-size:31px;font-weight:900;margin:8px 0 3px}
.message{font-size:17px;font-weight:700;line-height:1.5;white-space:pre-line}
.clock{margin-top:9px;font-size:14px;color:#555}
.bottom-actions{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.admin{display:inline-block;color:#666;text-decoration:none;font-size:13px}
.camera-start{padding:8px 12px;border:0;border-radius:9px;background:#222;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
@media(max-width:600px){
  .wrap{width:100vw;max-width:none;margin:0;padding:0}
  .main-card{width:100vw;min-height:100dvh;margin:0;padding:10px;border:0;border-radius:0;box-shadow:none}
  .header{padding:10px 0 12px}
  .logo{width:210px;max-width:62%}
  .title{font-size:21px}
  #reader{width:100vw!important;margin-left:-10px!important;border-radius:0!important;min-height:0;height:calc(100dvh - 242px);max-height:none}
  #reader video{width:100vw!important;height:100%!important;min-height:0!important;max-height:none!important;object-fit:cover!important;border-radius:0!important}
  .hint{font-size:13px;margin-top:10px}
}
</style>

    <div class="bottom-actions">
      <a id="adminLink" class="admin" href="#">⚙ 관리자</a>
      <button id="cameraStart" class="camera-start" type="button">카메라 시작</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 반드시 본인의 Apps Script 웹앱 배포 URL로 교체하세요.
// 예: https://script.google.com/macros/s/XXXXXXXX/exec
// ============================================================
const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzjUtyAXlZnRSsws8lji4r19UyHWHMrr86zE3x1Dyfvo38dJxOIx2Xa_CCrMZP_Htc/exec';

let scanner = null;
let scanning = false;
let busy = false;
let resetTimer = null;

const $ = id => document.getElementById(id);

function setStatus(text) { $('status').textContent = text; }

function setRemaining(value) {
  $('remainingCount').textContent =
    (value === null || value === undefined) ? '--' : String(value);
}

function showResult(d) {
  const box = $('result');
  box.className = 'result ' + (d.type || 'invalid');
  $('icon').textContent = d.type === 'success' ? '✓' : d.type === 'duplicate' ? '!' : '×';
  $('resultName').textContent = d.name || '확인 필요';
  $('resultMessage').textContent = d.message || '';
  $('resultTime').textContent = d.time ? '등록시간: ' + d.time : '';

  clearTimeout(resetTimer);
  resetTimer = setTimeout(() => {
    box.className = 'result';
    busy = false;
  }, 2300);
}

function apiRegister(qrText) {
  const callbackName = '__mealCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const script = document.createElement('script');
  let finished = false;

  window[callbackName] = function(data) {
    finished = true;
    cleanup();
    if (data && Object.prototype.hasOwnProperty.call(data,'remaining')) setRemaining(data.remaining);
    showResult(data || {type:'invalid', message:'서버 응답이 없습니다.'});
  };

  function cleanup() {
    delete window[callbackName];
    script.remove();
  }

  script.onerror = function() {
    cleanup();
    if (!finished) showResult({type:'invalid', message:'서버 연결에 실패했습니다.'});
  };

  const url = GAS_WEB_APP_URL
    + '?mode=api&action=register'
    + '&qr=' + encodeURIComponent(qrText)
    + '&callback=' + encodeURIComponent(callbackName)
    + '&t=' + Date.now();

  script.src = url;
  document.body.appendChild(script);
}

function apiMealStatus() {
  const callbackName = '__mealStatus_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const script = document.createElement('script');

  window[callbackName] = function(data) {
    if (data && data.ok) setRemaining(data.remaining);
    delete window[callbackName];
    script.remove();
  };

  script.onerror = function() {
    delete window[callbackName];
    script.remove();
  };

  script.src = GAS_WEB_APP_URL
    + '?mode=api&action=status'
    + '&callback=' + encodeURIComponent(callbackName)
    + '&t=' + Date.now();

  document.body.appendChild(script);
}

function onScanSuccess(decodedText) {
  if (busy) return;
  busy = true;
  setStatus('QR 확인 중...');
  apiRegister(decodedText);
}

async function stopScanner() {
  if (!scanner) return;
  try {
    if (scanning) await scanner.stop();
  } catch (e) {}
  try {
    scanner.clear();
  } catch (e) {}
  scanner = null;
  scanning = false;
}

async function startScanner() {
  if (scanning) return;

  $('err').style.display = 'none';
  $('retry').style.display = 'none';
  setStatus('카메라 준비 중...');

  if (!window.isSecureContext) {
    $('err').innerHTML = '보안 연결(HTTPS)에서만 카메라를 사용할 수 있습니다.';
    $('err').style.display = 'block';
    $('retry').style.display = 'block';
    setStatus('HTTPS 필요');
    return;
  }

  try {
    if (!scanner) scanner = new Html5Qrcode('reader');

    const config = {
      fps: 10,
      qrbox: (w, h) => {
        const size = Math.floor(Math.min(w, h) * 0.62);
        return { width: size, height: size };
      },
      aspectRatio: 1,
      disableFlip: false
    };

    // html5-qrcode의 start()에는 {video:true}나
    // {facingMode:{ideal:'environment'}}를 직접 넣을 수 없습니다.
    // 모바일/PC 모두 getCameras()로 실제 카메라 ID를 확인한 뒤 시작합니다.
    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error('사용 가능한 카메라를 찾을 수 없습니다.');
    }

    // 후면 카메라를 우선 선택하고, 찾지 못하면 첫 번째 카메라 사용
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let selectedCamera = cameras[0];

    if (isMobile) {
      const rearCamera = cameras.find(camera =>
        /back|rear|environment|후면|뒷면/i.test(camera.label || '')
      );
      if (rearCamera) selectedCamera = rearCamera;
    } else {
      // PC는 기본 카메라를 우선 사용
      selectedCamera = cameras[0];
    }

    await scanner.start(
      selectedCamera.id,
      config,
      onScanSuccess,
      () => {}
    );
    scanning = true;
    setStatus('● 스캔 대기 중');
  } catch (e) {
    console.error('카메라 시작 오류:', e);
    await stopScanner();
    $('err').innerHTML = '카메라를 시작할 수 없습니다.<br>브라우저의 카메라 권한과 연결 상태를 확인해주세요.';
    $('err').style.display = 'block';
    $('retry').style.display = 'block';
    setStatus('카메라 오류: ' + (e && e.name ? e.name : '확인 필요'));
  }
}


$('cameraStart').addEventListener('click', async () => {
  await stopScanner();
  setTimeout(startScanner, 150);
});

$('retry').addEventListener('click', async () => {
  await stopScanner();
  setTimeout(startScanner, 150);
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) apiMealStatus();
});
window.addEventListener('focus', apiMealStatus);

(function init() {
  if (GAS_WEB_APP_URL === 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') {
    $('err').textContent = 'Apps Script 웹앱 주소를 HTML에 입력해주세요.';
    $('err').style.display = 'block';
    setStatus('웹앱 주소 설정 필요');
  } else {
    $('adminLink').href = GAS_WEB_APP_URL + '?mode=admin';
    apiMealStatus();
    setInterval(apiMealStatus, 3000);
    setStatus('카메라 시작 버튼을 눌러주세요.');
  }
})();
</script>
</body>
</html>
